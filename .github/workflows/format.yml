name: Check formatting

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pin the same major version contributors use locally; output differs
      # between releases.
      - name: Install clang-format
        run: pip install clang-format==23.1.4

      - name: Check src and tests
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z 'src/*.cpp' 'src/*.h' 'tests/*.cpp' 'tests/*.h' \
            | xargs -0 clang-format --dry-run --Werror
