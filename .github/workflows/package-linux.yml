name: Build Linux packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "[0-9]*"

concurrency:
  group: package-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  actions: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -nE \
              's/^project\(fcitx5-areca VERSION ([^ ]+) .*/\1/p' \
              CMakeLists.txt)"
          fi
          if [[ -z "$version" ]]; then
            echo "Could not resolve the Areca package version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  ubuntu:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            version: "24.04"
            runner: ubuntu-24.04
            package_suffix: ubuntu24
            artifact_name: fcitx5-areca-ubuntu24-deb
            # Ubuntu 24.04 (Noble) has no libsdl3-dev in its repos yet
            # (SDL3 only landed from 24.10 onward), so we build it from
            # source and bundle the resulting .so with the package.
            bundle_sdl3: true
          - name: Ubuntu 26.04
            version: "26.04"
            runner: ubuntu-26.04
            package_suffix: ubuntu26
            artifact_name: fcitx5-areca-ubuntu26-deb
            bundle_sdl3: false
          - name: Linux Mint 22
            version: "24.04"
            runner: ubuntu-24.04
            package_suffix: mint22
            artifact_name: fcitx5-areca-mint22-deb
            bundle_sdl3: true
    env:
      VERSION: ${{ needs.version.outputs.value }}
      DEBIAN_FRONTEND: noninteractive
      SDL3_PREFIX: /opt/sdl3-local
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ubuntu build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            extra-cmake-modules \
            golang-go \
            ruby \
            ruby-dev \
            fcitx5 \
            fcitx5-config-qt \
            fcitx5-frontend-gtk3 \
            fcitx5-frontend-qt5 \
            libdbus-1-dev \
            libei-dev \
            libinput-dev \
            libportal-dev \
            libudev-dev \
            libfcitx5core-dev \
            libfcitx5config-dev \
            libfcitx5utils-dev \
            libfontconfig-dev \
            libx11-dev \
            libxtst-dev \
            patchelf
          sudo gem install --no-document fpm

      - name: Install libsdl3-dev from repos (Ubuntu 26.04+)
        if: ${{ matrix.bundle_sdl3 == false }}
        run: |
          set -euo pipefail
          sudo apt-get install -y libsdl3-dev

      - name: Install X11/Wayland dev libraries for building SDL3
        if: ${{ matrix.bundle_sdl3 == true }}
        run: |
          set -euo pipefail
          sudo apt-get install -y \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libibus-1.0-dev \
            libpulse-dev \
            libasound2-dev

      - name: Build SDL3 from source (Ubuntu 24.04, no repo package)
        if: ${{ matrix.bundle_sdl3 == true }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.2.x \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3-src
          cmake -S /tmp/sdl3-src -B /tmp/sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDL3_PREFIX" \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF
          cmake --build /tmp/sdl3-build --parallel
          sudo cmake --install /tmp/sdl3-build

      - name: Build and test
        run: |
          set -euo pipefail
          extra_prefix_path=""
          if [[ "${{ matrix.bundle_sdl3 }}" == "true" ]]; then
            extra_prefix_path="-DCMAKE_PREFIX_PATH=$SDL3_PREFIX"
          fi
          cmake -S . -B build-pkg -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=ON \
            $extra_prefix_path
          cmake --build build-pkg --parallel
          ctest --test-dir build-pkg --output-on-failure

      - name: Package DEB
        run: |
          set -euo pipefail
          mkdir -p pkgroot dist
          DESTDIR="$PWD/pkgroot" cmake --install build-pkg --strip

          sdl3_depend_args=()
          if [[ "${{ matrix.bundle_sdl3 }}" == "true" ]]; then
            # Bundle the self-built libSDL3 alongside the app instead of
            # depending on a system package that doesn't exist on 24.04.
            bundle_dir="pkgroot/usr/lib/fcitx5-areca"
            mkdir -p "$bundle_dir"
            cp -a "$SDL3_PREFIX"/lib/libSDL3.so* "$bundle_dir/"

            # Point every ELF binary/library we installed at the bundled dir.
            while IFS= read -r -d '' f; do
              if patchelf --print-rpath "$f" >/dev/null 2>&1; then
                patchelf --set-rpath '$ORIGIN/../lib/fcitx5-areca' "$f" || true
              fi
            done < <(find pkgroot/usr/bin pkgroot/usr/lib \
                       -maxdepth 2 -type f -print0 2>/dev/null)
          else
            sdl3_depend_args+=(--depends libsdl3-0)
          fi

          fpm -s dir -t deb \
            -n fcitx5-areca \
            -v "$VERSION" \
            --architecture amd64 \
            --description "Areca Vietnamese input method for Fcitx5" \
            --url "https://github.com/xhkzeroone/ArecaIME" \
            --license MIT \
            --depends fcitx5 \
            --depends fcitx5-frontend-gtk3 \
            --depends fcitx5-frontend-qt5 \
            --depends libdbus-1-3 \
            --depends libfontconfig1 \
            --depends libei1 \
            --depends libinput10 \
            --depends libportal1 \
            --depends libudev1 \
            --depends libx11-6 \
            --depends libxtst6 \
            "${sdl3_depend_args[@]}" \
            -C pkgroot \
            -p "dist/fcitx5-areca_${VERSION}_${{ matrix.package_suffix }}_amd64.deb" \
            .
          dpkg-deb -c \
            "dist/fcitx5-areca_${VERSION}_${{ matrix.package_suffix }}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.deb
          if-no-files-found: error

  arch:
    name: Arch Linux rolling
    runs-on: ubuntu-24.04
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create source archive including Bamboo
        run: |
          set -euo pipefail
          mkdir -p arch-pkg dist
          git ls-files --recurse-submodules -z | \
            tar --null --files-from=- --create --gzip \
              --transform="s,^,fcitx5-areca-${VERSION}/," \
              --file="arch-pkg/fcitx5-areca-${VERSION}.tar.gz"
          cp packaging/arch/PKGBUILD arch-pkg/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" arch-pkg/PKGBUILD

      - name: Build and test Pacman package in Arch Linux
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm
              pacman -S --needed --noconfirm \
                base-devel \
                cmake \
                extra-cmake-modules \
                fcitx5 \
                go \
                libei \
                libinput \
                libportal \
                ninja \
                pkgconf \
                fontconfig \
                libx11 \
                libxtst \
                systemd-libs \
                dbus \
                sdl3
              useradd --create-home builder
              chown -R builder:builder arch-pkg
              su builder -c \
                "cd /work/arch-pkg && makepkg --noconfirm --check"
              mv arch-pkg/*.pkg.tar.zst dist/
            '

      - uses: actions/upload-artifact@v4
        with:
          name: fcitx5-areca-arch-pacman
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  fedora:
    name: Fedora latest
    runs-on: ubuntu-24.04
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build, test and package in Fedora latest
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm \
            -e VERSION="$VERSION" \
            -v "$PWD:/work" \
            -w /work \
            fedora:latest \
            bash -lc '
              set -euo pipefail
              dnf install -y \
                gcc-c++ \
                make \
                cmake \
                ninja-build \
                pkgconf-pkg-config \
                extra-cmake-modules \
                golang \
                ruby \
                ruby-devel \
                rpm-build \
                dbus-devel \
                libinput-devel \
                systemd-devel \
                SDL3 \
                SDL3-devel \
                fontconfig \
                fontconfig-devel \
                libX11-devel \
                libXtst-devel \
                fcitx5 \
                fcitx5-devel \
                fcitx5-configtool
              gem install --no-document fpm

              cmake -S . -B build-pkg-fedora -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DBUILD_TESTING=ON
              cmake --build build-pkg-fedora --parallel
              ctest --test-dir build-pkg-fedora --output-on-failure

              mkdir -p pkgroot-fedora
              DESTDIR="$PWD/pkgroot-fedora" \
                cmake --install build-pkg-fedora --strip
              fpm -s dir -t rpm \
                -n fcitx5-areca \
                -v "$VERSION" \
                --architecture x86_64 \
                --description "Areca Vietnamese input method for Fcitx5" \
                --url "https://github.com/xhkzeroone/ArecaIME" \
                --license MIT \
                --depends fcitx5 \
                --depends dbus-libs \
                --depends libinput \
                --depends systemd-libs \
                --depends SDL3 \
                --depends fontconfig \
                --depends libX11 \
                --depends libXtst \
                -C pkgroot-fedora \
                -p "dist/fcitx5-areca-${VERSION}.fedora-latest.x86_64.rpm" \
                .
              rpm -qpl \
                "dist/fcitx5-areca-${VERSION}.fedora-latest.x86_64.rpm"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: fcitx5-areca-fedora-rpm
          path: dist/*.rpm
          if-no-files-found: error

  debian:
    name: Debian 12 (Bookworm)
    runs-on: ubuntu-24.04
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.value }}
      DEBIAN_FRONTEND: noninteractive
      SDL3_PREFIX: /opt/sdl3-local
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build, test and package in Debian 12
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm \
            -e VERSION="$VERSION" \
            -e DEBIAN_FRONTEND=noninteractive \
            -e SDL3_PREFIX="$SDL3_PREFIX" \
            -v "$PWD:/work" \
            -w /work \
            debian:bookworm \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y \
                build-essential \
                cmake \
                ninja-build \
                pkg-config \
                extra-cmake-modules \
                golang-go \
                ruby \
                ruby-dev \
                git \
                fcitx5 \
                fcitx5-config-qt \
                fcitx5-frontend-gtk3 \
                fcitx5-frontend-qt5 \
                libdbus-1-dev \
                libei-dev \
                libinput-dev \
                libportal-dev \
                libudev-dev \
                libfcitx5core-dev \
                libfcitx5config-dev \
                libfcitx5utils-dev \
                libfontconfig-dev \
                libx11-dev \
                libxtst-dev \
                patchelf \
                libxext-dev \
                libxrandr-dev \
                libxcursor-dev \
                libxfixes-dev \
                libxi-dev \
                libxss-dev \
                libxkbcommon-dev \
                libwayland-dev \
                wayland-protocols \
                libdecor-0-dev \
                libdrm-dev \
                libgbm-dev \
                libgl1-mesa-dev \
                libegl1-mesa-dev \
                libasound2-dev
              gem install --no-document fpm

              # Build SDL3 from source (Debian 12 has no official SDL3 package yet)
              git clone --depth 1 --branch release-3.2.x \
                https://github.com/libsdl-org/SDL.git /tmp/sdl3-src
              cmake -S /tmp/sdl3-src -B /tmp/sdl3-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$SDL3_PREFIX" \
                -DSDL_SHARED=ON \
                -DSDL_STATIC=OFF
              cmake --build /tmp/sdl3-build --parallel
              cmake --install /tmp/sdl3-build

              # Build Areca
              cmake -S . -B build-pkg-debian -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DCMAKE_PREFIX_PATH="$SDL3_PREFIX" \
                -DBUILD_TESTING=ON
              cmake --build build-pkg-debian --parallel
              ctest --test-dir build-pkg-debian --output-on-failure

              # Package DEB
              mkdir -p pkgroot-debian
              DESTDIR="$PWD/pkgroot-debian" cmake --install build-pkg-debian --strip

              bundle_dir="pkgroot-debian/usr/lib/fcitx5-areca"
              mkdir -p "$bundle_dir"
              cp -a "$SDL3_PREFIX"/lib/libSDL3.so* "$bundle_dir/"

              while IFS= read -r -d "" f; do
                if patchelf --print-rpath "$f" >/dev/null 2>&1; then
                  patchelf --set-rpath "\$ORIGIN/../lib/fcitx5-areca" "$f" || true
                fi
              done < <(find pkgroot-debian/usr/bin pkgroot-debian/usr/lib \
                         -maxdepth 2 -type f -print0 2>/dev/null)

              fpm -s dir -t deb \
                -n fcitx5-areca \
                -v "$VERSION" \
                --architecture amd64 \
                --description "Areca Vietnamese input method for Fcitx5" \
                --url "https://github.com/xhkzeroone/ArecaIME" \
                --license MIT \
                --depends fcitx5 \
                --depends fcitx5-frontend-gtk3 \
                --depends fcitx5-frontend-qt5 \
                --depends libdbus-1-3 \
                --depends libfontconfig1 \
                --depends libei1 \
                --depends libinput10 \
                --depends libportal1 \
                --depends libudev1 \
                --depends libx11-6 \
                --depends libxtst6 \
                -C pkgroot-debian \
                -p "dist/fcitx5-areca_${VERSION}_debian12_amd64.deb" \
                .
              dpkg-deb -c \
                "dist/fcitx5-areca_${VERSION}_debian12_amd64.deb"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: fcitx5-areca-debian12-deb
          path: dist/*.deb
          if-no-files-found: error

  opensuse:
    name: openSUSE Tumbleweed
    runs-on: ubuntu-24.04
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build, test and package in openSUSE Tumbleweed
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm \
            -e VERSION="$VERSION" \
            -v "$PWD:/work" \
            -w /work \
            opensuse/tumbleweed:latest \
            bash -lc '
              set -euo pipefail
              zypper --non-interactive refresh
              zypper --non-interactive install -y --no-recommends \
                gcc-c++ \
                make \
                cmake \
                ninja \
                pkgconf-pkg-config \
                extra-cmake-modules \
                go \
                ruby \
                ruby-devel \
                rpm-build \
                dbus-1-devel \
                libinput-devel \
                systemd-devel \
                SDL3-devel \
                fontconfig-devel \
                libX11-devel \
                libXtst-devel \
                libei-devel \
                libportal-devel \
                fcitx5 \
                fcitx5-devel
              gem install --no-document fpm

              cmake -S . -B build-pkg-opensuse -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr \
                -DBUILD_TESTING=ON
              cmake --build build-pkg-opensuse --parallel
              ctest --test-dir build-pkg-opensuse --output-on-failure

              mkdir -p pkgroot-opensuse
              DESTDIR="$PWD/pkgroot-opensuse" \
                cmake --install build-pkg-opensuse --strip
              fpm -s dir -t rpm \
                -n fcitx5-areca \
                -v "$VERSION" \
                --architecture x86_64 \
                --description "Areca Vietnamese input method for Fcitx5" \
                --url "https://github.com/xhkzeroone/ArecaIME" \
                --license MIT \
                --depends fcitx5 \
                --depends libdbus-1-3 \
                --depends libinput10 \
                --depends SDL3 \
                --depends fontconfig \
                --depends libX11-6 \
                --depends libXtst6 \
                -C pkgroot-opensuse \
                -p "dist/fcitx5-areca-${VERSION}.opensuse-tumbleweed.x86_64.rpm" \
                .
              rpm -qpl \
                "dist/fcitx5-areca-${VERSION}.opensuse-tumbleweed.x86_64.rpm"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: fcitx5-areca-opensuse-rpm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish tagged release
    runs-on: ubuntu-24.04
    needs:
      - ubuntu
      - debian
      - arch
      - fedora
      - opensuse
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --notes "Areca packages for Ubuntu, Linux Mint, Debian, Arch Linux, Fedora, and openSUSE."
          fi
          find artifacts -type f -print0 | \
            xargs -0 gh release upload "$tag" --clobber
