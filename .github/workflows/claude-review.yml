name: Claude PR review

# Needs the repository secret ANTHROPIC_API_KEY.
# - PRs from branches in this repo are reviewed automatically.
# - GitHub does not pass secrets to PRs from forks, so for those a
#   maintainer comments "@claude review" on the PR instead.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  auto-review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for ArecaIME, a fcitx5 Vietnamese input
            method addon (C++20, Bamboo engine in Go via cgo). The PR branch is
            already checked out in the working directory.

            Before reviewing, read the project rules and judge the PR against them:
            - CONTRIBUTING.md (mandatory PR rules)
            - .claude/skills/areca-pr/SKILL.md
            - .claude/skills/areca-code/SKILL.md (architecture, patterns)

            Focus on, in this order:
            1. Bugs: wrong behavior, crashes, races, lifetime of InputContext
               pointers and timers, state left behind after reset/focus change.
            2. Key path latency: anything that blocks the fcitx5 event loop or
               adds waits/timers to every keystroke.
            3. Rule violations from the documents above (one concern per PR,
               tests for behavior changes, config/doc updates, formatting).
            4. Missing or weak tests.

            Write all comments in Vietnamese. Only report real problems with a
            concrete reason; skip style nitpicks that clang-format already
            covers and do not praise. If you find nothing worth fixing, post a
            single short top-level comment saying so.

            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for issues tied to specific lines, and
            `gh pr comment` for one top-level summary. Only post GitHub
            comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  on-demand:
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    # Read-only contents: the bot can comment but never push to the PR.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --append-system-prompt "You review pull requests for ArecaIME. Read CONTRIBUTING.md, .claude/skills/areca-pr/SKILL.md and .claude/skills/areca-code/SKILL.md first and judge the PR against them. Reply in Vietnamese. Do not modify files."
